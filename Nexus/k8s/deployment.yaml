apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-lms
  labels:
    app: nexus-lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-lms
  template:
    metadata:
      labels:
        app: nexus-lms
    spec:
      containers:
        - name: nexus-lms
          image: nginxinc/nginx-unprivileged:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-lms-service
  labels:
    app: nexus-lms
spec:
  selector:
    app: nexus-lms
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
