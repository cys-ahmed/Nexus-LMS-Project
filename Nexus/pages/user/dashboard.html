<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Dashboard – Nexus</title>
  <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="../../assets/Application_Logo.png" alt="Nexus" onerror="this.style.display='none'" />
        <span>NEXUS</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Learning</div>
        <a href="dashboard.html" class="nav-item active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          Dashboard
        </a>
        <a href="courses.html" class="nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          </svg>
          Course Catalog
        </a>
        <div class="nav-section">Account</div>
        <a href="profile.html" class="nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Profile
        </a>
        <a href="certificates.html" class="nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="6" />
            <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" />
          </svg>
          Certificates
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="flex items-center gap-2" style="margin-bottom:.75rem">
          <div class="avatar" id="user-av">U</div>
          <div>
            <div class="text-sm font-medium" id="sidebar-user">User</div>
            <div class="text-xs text-muted">Student</div>
          </div>
        </div>
        <button class="btn btn-outline w-full btn-sm" id="logout-btn">Logout</button>
      </div>
    </aside>
    <div class="main-area">
      <div class="topbar">
        <div class="topbar-left">
          <h1>Dashboard</h1>
          <p>Welcome back, <span id="topbar-user"></span>!</p>
        </div>
        <button class="btn btn-default btn-sm" onclick="location.href='courses.html'">Browse Courses</button>
      </div>
      <div class="page-body">
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background:hsl(217,91%,60%,.12)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="hsl(217,91%,60%)" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
              </svg>
            </div>
            <div class="stat-label">Enrolled Courses</div>
            <div class="stat-value" id="stat-enrolled">—</div>
            <div class="stat-sub">active courses</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:hsl(142,71%,45%,.12)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="hsl(142,71%,45%)" stroke-width="2">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="stat-label">Completed</div>
            <div class="stat-value" id="stat-completed">—</div>
            <div class="stat-sub">courses finished</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:hsl(38,92%,50%,.12)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="hsl(38,92%,50%)" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
            </div>
            <div class="stat-label">Watch Hours</div>
            <div class="stat-value" id="stat-hours">—</div>
            <div class="stat-sub">this month</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:hsl(217,91%,60%,.12)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="hsl(217,91%,60%)" stroke-width="2">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
              </svg>
            </div>
            <div class="stat-label">Avg. Progress</div>
            <div class="stat-value" id="stat-progress">—</div>
            <div class="stat-sub">across all courses</div>
          </div>
        </div>
        <div class="tabs-list cols-2 mb-4">
          <button class="tab-btn active" data-tab="courses">My Courses</button>
          <button class="tab-btn" data-tab="recent">Recent Activity</button>
        </div>
        <div class="tab-panel active" id="tab-courses">
          <div class="course-grid" id="enrolled-list"></div>
        </div>
        <div class="tab-panel" id="tab-recent">
          <div class="card">
            <div class="card-content-flush divide-y" id="recent-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/dashboard.js"></script>
</body>
</html>
